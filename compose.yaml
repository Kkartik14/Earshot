services:
  earshot:
    build: .
    image: earshot:local
    environment:
      EARSHOT_HOST: 0.0.0.0
      # This unauthenticated setup binds to loopback; use a token and TLS proxy before exposing it elsewhere.
      EARSHOT_TRUST_LOCAL_NETWORK: "true"
    ports:
      - "127.0.0.1:4319:4319"
    volumes:
      - earshot-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  earshot-data:
