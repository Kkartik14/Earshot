packages:
  - "packages/*"
  - "apps/*"
  # Only example subdirectories that ship a package.json are treated as workspace
  # projects; the Python examples alongside them are ignored (they have none).
  - "examples/*"

minimumReleaseAgeExclude:
  - "@turbo/darwin-64@2.11.5"
  - "@turbo/darwin-arm64@2.11.5"
  - "@turbo/linux-64@2.11.5"
  - "@turbo/linux-arm64@2.11.5"
  - "@turbo/windows-64@2.11.5"
  - "@turbo/windows-arm64@2.11.5"
  - turbo@2.11.5

overrides:
  js-yaml: 4.3.0
