[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "earshot-observability"
version = "0.3.0"
description = "The open-source Voice Observability SDK for real-time voice AI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Earshot contributors" }]
keywords = ["voice-ai", "observability", "opentelemetry", "sdk", "llmops"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.9,<3",
  "protobuf>=6.33.5,<8",
  "rfc8785==0.1.4",
]

[project.optional-dependencies]
server = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "opentelemetry-proto>=1.30,<2",
  "PyJWT[crypto]>=2.15.1,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.30,<1",
]
# Postgres catalog driver. Storage imports it lazily, only for a postgresql:// URL.
postgres = ["psycopg[binary]>=3.2,<4"]
# S3-compatible blob store client. Imported lazily, only for an s3:// blob URL.
# 1.36 is the first release with request_checksum_calculation (earshot/blobstore.py).
s3 = ["boto3>=1.36,<2"]
# Opt-in envelope encryption (AES-256-GCM) for the durable spool at rest. The
# base install stays dependency-light; import it lazily and only when a spool
# key is configured.
spool-encryption = ["cryptography>=42,<46"]
# Recording analysis (speech runs, peaks, renditions), run by the server in a child
# process. Without it the server runs and marks each analysis unavailable
# (EARSHOT_SIGNALS_EXTRA_REQUIRED). The Silero VAD model ships in the package.
signals = [
  "numpy>=1.26,<3",
  "onnxruntime>=1.20,<2",
  "soundfile>=0.13,<0.14",
]
dev = [
  "alembic>=1.13,<2",
  "boto3>=1.36,<2",
  "build>=1.2,<2",
  "cryptography>=42,<46",
  "fastapi>=0.115,<1",
  # The OTLP receiver tests decode error bodies with the reference google.rpc.Status
  # and export spans with the real OpenTelemetry SDK and HTTP exporter.
  "googleapis-common-protos>=1.56,<2",
  "grpcio-tools==1.81.1",
  "httpx>=0.27,<1",
  "hypothesis>=6.120,<7",
  # The signals extra: the analysis tests run the real decoder and VAD.
  "numpy>=1.26,<3",
  "onnxruntime>=1.20,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
  "opentelemetry-proto>=1.30,<2",
  "opentelemetry-sdk>=1.30,<2",
  "psycopg[binary]>=3.2,<4",
  "PyJWT[crypto]>=2.15.1,<3",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=6,<7",
  "pyyaml>=6,<7",
  "ruff>=0.9,<1",
  "soundfile>=0.13,<0.14",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.30,<1",
]
otel = ["opentelemetry-api>=1.30,<2", "opentelemetry-sdk>=1.30,<2"]
pipecat = [
  "opentelemetry-api>=1.30,<2",
  "opentelemetry-sdk>=1.30,<2",
  "pipecat-ai[tracing]>=1.6.0,<1.7",
]
pipecat-groq = [
  "opentelemetry-api>=1.30,<2",
  "opentelemetry-sdk>=1.30,<2",
  "pipecat-ai[groq,tracing]>=1.6.0,<1.7",
]
pipecat-matrix = [
  "opentelemetry-api>=1.30,<2",
  "opentelemetry-sdk>=1.30,<2",
  "pipecat-ai[assemblyai,cartesia,deepgram,elevenlabs,groq,openai,sarvam,soniox,tracing]==1.6.0",
]
livekit = [
  "livekit-agents>=1.6.5,<1.9",
  "opentelemetry-api>=1.30,<2",
  "opentelemetry-sdk>=1.30,<2",
]

[project.urls]
Homepage = "https://github.com/Kkartik14/Earshot"
Documentation = "https://github.com/Kkartik14/Earshot/tree/main/docs"
Repository = "https://github.com/Kkartik14/Earshot.git"
Issues = "https://github.com/Kkartik14/Earshot/issues"
Changelog = "https://github.com/Kkartik14/Earshot/releases"

[project.scripts]
earshot = "earshot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["packages/sdk-python/src/earshot"]
# The viewer SPA is built into src/earshot/web by `pnpm bundle` (git-ignored);
# ship it in the wheel so `pip install earshot` serves the UI out of the box.
artifacts = ["packages/sdk-python/src/earshot/web/**"]

[tool.hatch.build.targets.sdist]
only-include = [
  "LICENSE",
  "README.md",
  "pyproject.toml",
  "packages/sdk-python/src/earshot",
]
exclude = [
  "/**/.DS_Store",
  "/**/__pycache__",
  "/**/*.pyc",
  "/**/*.pyo",
]
artifacts = [
  "packages/sdk-python/src/earshot/web/**",
  "!packages/sdk-python/src/earshot/web/**/*.map",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["packages/sdk-python/tests", "apps/ingest/tests"]
markers = [
  "unit: isolated contract or analysis tests",
  "integration: tests crossing storage or HTTP boundaries",
  "e2e: tests exercising a real server process and persistent database",
  "property: generative/property-based tests",
  "sqlite_only: reaches into SQLite or file-CAS internals; not run under --db postgresql",
  "postgres_only: needs a Postgres store; not run under --db sqlite",
  "real_providers: calls real provider APIs and needs their credentials",
  "slow: takes about 10 s or more; deselect with -m \"not slow\" while building (plain pytest runs it)",
]

[tool.coverage.run]
branch = true
source = ["earshot"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["packages/sdk-python/src", "packages/sdk-python/tests", "apps/ingest/tests"]
exclude = ["packages/sdk-python/src/earshot/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
