name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.release.outputs.image }}
      npm_package: ${{ steps.release.outputs.npm_package }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Match the tag, package version, and image identity
        id: release
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: >-
          python scripts/check_release.py
          --tag "$RELEASE_TAG"
          --repository "$RELEASE_REPOSITORY"
          --github-output "$GITHUB_OUTPUT"
      - name: Require release tags to point into the default branch
        if: github.ref_type == 'tag'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "release tag must point to a commit contained in $DEFAULT_BRANCH" >&2
            exit 1
          fi

  build-python:
    name: Build and inspect Python distributions
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Build the viewer, wheel, and source distribution
        run: |
          python -m pip install 'build>=1.2,<2'
          pnpm install --frozen-lockfile
          pnpm --filter @earshot/viewer bundle
          python -m build --wheel --sdist --outdir dist
      - name: Inspect and smoke-test the distributions
        run: |
          python scripts/check_wheel.py dist/*.whl
          python scripts/check_sdist.py dist/*.tar.gz
          python scripts/smoke_artifact.py dist/*.whl
          python scripts/smoke_artifact.py dist/*.tar.gz
      - name: Upload immutable release inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  build-npm:
    name: Build and inspect Node npm package
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Require the release identity in the Node package
        env:
          RELEASE_PACKAGE: ${{ needs.validate.outputs.npm_package }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          package=packages/node/package.json
          version="$(node -p "require('./$package').version")"
          if [[ "$version" != "$RELEASE_VERSION" ]]; then
            echo "$package is version $version; the release is $RELEASE_VERSION" >&2
            exit 1
          fi
          name="$(node -p "require('./$package').name")"
          if [[ "$name" != "$RELEASE_PACKAGE" ]]; then
            echo "$package is $name; expected $RELEASE_PACKAGE" >&2
            exit 1
          fi
      - name: Build and pack the Node package
        # pnpm pack applies the Node package's publishConfig entry points.
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter earshot-observability build
          pnpm --filter earshot-observability pack --pack-destination "$PWD/npm-dist"
      - name: Require and inspect the only Node tarball
        env:
          RELEASE_PACKAGE: ${{ needs.validate.outputs.npm_package }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          expected="npm-dist/${RELEASE_PACKAGE}-${RELEASE_VERSION}.tgz"
          shopt -s nullglob
          tarballs=(npm-dist/*.tgz)
          if [[ "${#tarballs[@]}" -ne 1 || "${tarballs[0]}" != "$expected" ]]; then
            printf 'expected only %s; found: %s\n' "$expected" "${tarballs[*]}" >&2
            exit 1
          fi
          unexpected="$(tar -tzf "$expected" \
            | grep -Ev '^package/((dist/.*)?|README\.md|LICENSE|package\.json)$' || true)"
          if [[ -n "$unexpected" ]]; then
            printf '%s ships unexpected files:\n%s\n' "$expected" "$unexpected" >&2
            exit 1
          fi
          unpacked="$(mktemp -d)"
          tar -xzf "$expected" -C "$unpacked"
          # shellcheck disable=SC2016 # a JavaScript program, not shell
          node --input-type=module -e '
            import { existsSync, readFileSync } from "node:fs";
            import { join } from "node:path";
            const root = process.argv[1];
            const manifest = JSON.parse(readFileSync(join(root, "package.json"), "utf8"));
            if (manifest.name !== process.env.RELEASE_PACKAGE ||
                manifest.version !== process.env.RELEASE_VERSION) {
              console.error("unexpected package identity", manifest.name, manifest.version);
              process.exit(1);
            }
            const targets = [];
            const collect = (value) =>
              typeof value === "string"
                ? targets.push(value)
                : Object.values(value ?? {}).forEach(collect);
            collect([manifest.main, manifest.types, manifest.exports]);
            const missing = targets.filter((target) => !existsSync(join(root, target)));
            const ranges = JSON.stringify([
              manifest.dependencies,
              manifest.peerDependencies,
              manifest.optionalDependencies,
            ]);
            if (missing.length > 0 || ranges.includes("workspace:")) {
              console.error(manifest.name, { missing, workspaceRanges: ranges.includes("workspace:") });
              process.exit(1);
            }
            console.log(`${manifest.name}@${manifest.version}: ${targets.length} entry points present`);
          ' "$unpacked/package"
          rm -rf "$unpacked"
      - name: Dry-run the publish command
        # The explicit file path is also used by publish-npm, which runs only on a tag.
        env:
          RELEASE_PACKAGE: ${{ needs.validate.outputs.npm_package }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          npm publish "./npm-dist/${RELEASE_PACKAGE}-${RELEASE_VERSION}.tgz" --dry-run --access public
      - name: Upload immutable release inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-npm-package
          path: npm-dist/${{ needs.validate.outputs.npm_package }}-${{ needs.validate.outputs.version }}.tgz
          if-no-files-found: error
          retention-days: 30

  publish-container:
    name: Publish GHCR image
    if: github.ref_type == 'tag'
    needs: [validate, build-python, build-npm]
    concurrency:
      group: ghcr-release-tags-${{ github.repository }}
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive OCI tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ needs.validate.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          # These override the action's repository-derived defaults; keep them
          # equal to the Dockerfile's labels so local and released images agree.
          labels: |
            org.opencontainers.image.title=Earshot
            org.opencontainers.image.description=Self-hosted Earshot server and viewer for voice-agent observability
            org.opencontainers.image.licenses=Apache-2.0
      - name: Resolve an existing immutable version tag for retry
        id: existing
        env:
          RELEASE_IMAGE: ${{ needs.validate.outputs.image }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_SHA: ${{ github.sha }}
        run: python3 scripts/ghcr_image.py
      - name: Build and push the release image
        if: steps.existing.outputs.exists != 'true'
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            EARSHOT_VERSION=${{ needs.validate.outputs.version }}
          tags: ${{ needs.validate.outputs.image }}:${{ needs.validate.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Select the immutable image digest
        id: digest
        env:
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
          PUSHED_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          digest="$EXISTING_DIGEST"
          if [[ -z "$digest" ]]; then
            digest="$PUSHED_DIGEST"
          fi
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "image publication produced no valid digest" >&2
            exit 1
          fi
          echo "value=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest the published image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ needs.validate.outputs.image }}
          subject-digest: ${{ steps.digest.outputs.value }}
          push-to-registry: true
      - name: Promote release aliases from the verified digest
        env:
          RELEASE_IMAGE: ${{ needs.validate.outputs.image }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_DIGEST: ${{ steps.digest.outputs.value }}
          RELEASE_TAGS: ${{ steps.meta.outputs.tags }}
        run: python3 scripts/promote_ghcr_tags.py <<<"$RELEASE_TAGS"

  publish-pypi:
    name: Publish to PyPI with OIDC
    if: github.ref_type == 'tag'
    needs: [validate, build-python, publish-container]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/earshot-observability
    permissions:
      id-token: write
    steps:
      - name: Download the inspected distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist
      - name: Publish the distributions
        # v1.14.2 or later: hatchling 1.32 writes Metadata-Version 2.5, which the
        # twine bundled in earlier releases rejects.
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: false

  publish-npm:
    name: Publish Node package with Trusted Publishing
    if: github.ref_type == 'tag'
    needs: [validate, build-npm, publish-container]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: npm
      url: https://www.npmjs.com/package/earshot-observability
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the inspected Node tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: node-npm-package
          path: npm-dist
      # Node 24.22.2 bundles npm 11.19.1, above npm's OIDC minimum of 11.5.1.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.2"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Verify the npm Trusted Publishing runtime
        run: |
          node_version="$(node --version)"
          npm_version="$(npm --version)"
          if [[ "$node_version" != "v24.22.2" || "$npm_version" != "11.19.1" ]]; then
            printf 'expected Node v24.22.2 with npm 11.19.1; found Node %s with npm %s\n' \
              "$node_version" "$npm_version" >&2
            exit 1
          fi
      - name: Publish the Node package
        env:
          RELEASE_PACKAGE: ${{ needs.validate.outputs.npm_package }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          expected="./npm-dist/${RELEASE_PACKAGE}-${RELEASE_VERSION}.tgz"
          shopt -s nullglob
          tarballs=(npm-dist/*.tgz)
          if [[ "${#tarballs[@]}" -ne 1 || "./${tarballs[0]}" != "$expected" ]]; then
            printf 'expected only %s; found: %s\n' "$expected" "${tarballs[*]}" >&2
            exit 1
          fi
          manifest="$(tar -xOf "$expected" package/package.json)"
          node -e '
            const manifest = JSON.parse(process.argv[1]);
            const [name, version] = process.argv.slice(2);
            if (manifest.name !== name || manifest.version !== version) {
              console.error("unexpected package identity", manifest.name, manifest.version);
              process.exit(1);
            }
          ' "$manifest" "$RELEASE_PACKAGE" "$RELEASE_VERSION"
          dist_tag="$(python "$GITHUB_WORKSPACE/scripts/npm_publish_tag.py" \
            --package "$RELEASE_PACKAGE" \
            --version "$RELEASE_VERSION" \
            --prerelease "$PRERELEASE")"
          if npm publish "$expected" --provenance --access public --tag "$dist_tag"; then
            exit 0
          fi

          # npm versions are immutable. A lost success response makes a plain rerun
          # fail, so accept an existing version only after npm verifies its signatures
          # and provenance matches these exact retained bytes and this workflow run.
          verification_dir="$(mktemp -d)"
          trap 'rm -rf "$verification_dir"' EXIT
          printf '{"name":"earshot-release-verification","version":"1.0.0","private":true}\n' \
            > "$verification_dir/package.json"
          cd "$verification_dir"
          npm install \
            --ignore-scripts \
            --omit=peer \
            --no-audit \
            --prefer-online \
            --cache "$verification_dir/cache" \
            --save-exact \
            "${RELEASE_PACKAGE}@${RELEASE_VERSION}"
          npm audit signatures --json --include-attestations > "$verification_dir/signatures.json"
          python "$GITHUB_WORKSPACE/scripts/verify_npm_publish.py" \
            --artifact "$GITHUB_WORKSPACE/$expected" \
            --audit-report "$verification_dir/signatures.json" \
            --package "$RELEASE_PACKAGE" \
            --version "$RELEASE_VERSION" \
            --repository "$RELEASE_REPOSITORY" \
            --workflow-path .github/workflows/release.yml \
            --ref "$RELEASE_REF" \
            --commit "$RELEASE_SHA" \
            --run-id "$RELEASE_RUN_ID" \
            --run-attempt "$RELEASE_RUN_ATTEMPT"

  github-release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: [validate, build-python, publish-container, publish-pypi, publish-npm]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Download the published distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist
      - name: Attest the Python distributions
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - name: Create the release with generated notes and artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          args=(
            "$RELEASE_TAG"
            dist/*
            --repo "$GITHUB_REPOSITORY"
            --verify-tag
            --generate-notes
            --title "Earshot $RELEASE_VERSION"
          )
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
