{{- include "earshot.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "earshot.fullname" . }}
  labels:
    {{- include "earshot.labels" . | nindent 4 }}
spec:
  {{- /*
  One server per database, always: a second one exits with
  EARSHOT_DATABASE_IN_USE, so a rolling update would stall. Recreate stops the
  old pod before the new one starts.
  */}}
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "earshot.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "earshot.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      {{- /* Service links would inject EARSHOT_PORT=tcp://… for a Service named earshot. */}}
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: earshot
          image: {{ include "earshot.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 4319
              protocol: TCP
          env:
            - name: EARSHOT_HOST
              value: "0.0.0.0"
            - name: EARSHOT_PORT
              value: "4319"
            - name: EARSHOT_DATA_DIR
              value: /data
            - name: EARSHOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret | quote }}
                  key: {{ .Values.auth.tokenKey | quote }}
            {{- if .Values.ingress.enabled }}
            - name: EARSHOT_BEHIND_TLS_PROXY
              value: "true"
            {{- else }}
            {{- /* In-cluster only (a Service or kubectl port-forward); the token is still required. */}}
            - name: EARSHOT_TRUST_LOCAL_NETWORK
              value: "true"
            {{- end }}
            {{- with .Values.database.existingSecret }}
            - name: EARSHOT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: {{ $.Values.database.urlKey | quote }}
            - name: EARSHOT_CORRELATION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: {{ $.Values.database.correlationKeyKey | quote }}
            {{- end }}
            {{- with .Values.blobs.url }}
            - name: EARSHOT_BLOB_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.blobs.existingSecret }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: {{ $.Values.blobs.accessKeyIdKey | quote }}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: {{ $.Values.blobs.secretAccessKeyKey | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- /* Migrations run before the server listens: give a first start time. */}}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 150
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (include "earshot.fullname" .) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
