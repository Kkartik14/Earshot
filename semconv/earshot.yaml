# Earshot semantic profile v0.2 authoring source.
# Keep vocabulary open for forward compatibility and reuse existing GenAI/OpenInference fields where applicable.
# Call grouping prefers `earshot.session.id`, `gen_ai.conversation.id`, `session.id`, then `conversation.id`.
# Adapters should pin the semantic-conventions revision they implement.
earshot_semantic_profile_version: 0.2.0
groups:
  - id: registry.earshot
    type: attribute_group
    brief: Common attributes for portable real-time voice-session evidence.
    attributes:
      - id: session.id
        type: string
        requirement_level: opt_in
        brief: A unique session identifier, reused from the pinned OpenTelemetry semantic-conventions registry.
      - id: earshot.session.id
        type: string
        requirement_level: recommended
        brief: The host's session key for the call a span belongs to, 1 to 256 UTF-8 bytes after trimming; the first key Earshot's receiver consults, on a span or on its resource.
      - id: earshot.call.ended
        type: boolean
        requirement_level: opt_in
        brief: Set to true on any span to signal that its call has ended, so the call closes after a short grace period.
      - id: earshot.agent.name
        type: string
        requirement_level: opt_in
        brief: The agent that handled the call, as the call list filters on it; preferred over gen_ai.agent.name, lk.agent_name and the resource service.name (an unknown_service default never names the agent). 1 to 256 characters; the first span carrying it wins.
      - id: earshot.call.outcome
        type: string
        requirement_level: opt_in
        brief: The call's outcome as the host defines it (for example transferred or voicemail), 1 to 256 characters; the last value sent wins. Without it Earshot derives error (a span with error status), interrupted (no end signal) or completed.
      - id: earshot.call.tags
        type: string[]
        requirement_level: opt_in
        brief: Labels for the call (each 1 to 256 characters); a call's tags are the union of every span's, and the call list filters on them (all given must match).
      - id: earshot.turn.id
        type: string
        requirement_level: opt_in
        brief: Opaque turn projection identifier; turns are not graph containers.
      - id: earshot.turn.index
        type: int
        requirement_level: opt_in
        brief: Producer-observed presentation order for a turn projection.
      - id: earshot.turn.reported_latency_ms
        type: double
        requirement_level: opt_in
        brief: "Host span profile: the host's own measure of a turn's latency, in milliseconds, on its turn span; a present value is a positive finite OTLP doubleValue or intValue. Absent or invalid values are unknown, never 0."
        note: The semantic type is double; a positive OTLP intValue is also permitted by the host profile as numeric input.
      - id: earshot.turn.timeline_continuous
        type: boolean
        requirement_level: opt_in
        brief: "Host span profile: false when the host's recording timeline was not continuous across the turn (frames dropped or placed late), so its audible gap is not measurable; true or absent, the timeline is taken as continuous."
      - id: earshot.speech.transcript.text
        type: string
        requirement_level: opt_in
        stability: development
        brief: Source-provided transcript text for the speech stretch represented by a host-profile speech span.
        note: >-
          In host profile 0.2.0, this attribute is valid only on user_speech and
          agent_speech spans. The span name supplies the speaker and its interval
          supplies the transcript line's timing. Omit it when no nonblank transcript
          was supplied; empty or whitespace-only values are invalid. Preserve the
          supplied text; do not derive it from audio or another stage's output. This
          is sensitive content and the host decides whether to send it. Earshot's
          metadata_only preset removes it before storage.
      - id: earshot.operation.name
        type: string
        requirement_level: required
        brief: Open voice operation name such as vad, turn_detection, stt, llm, tts, transport_send, or render.
      - id: earshot.operation.id
        type: string
        requirement_level: opt_in
        brief: Opaque incident operation referenced by a derived or provider quality sample.
      - id: earshot.participant.id
        type: string
        requirement_level: opt_in
        brief: Opaque participant reference from the incident profile.
      - id: earshot.stream.id
        type: string
        requirement_level: opt_in
        brief: Opaque audio-stream reference from the incident profile.
      - id: earshot.framework.name
        type: string
        requirement_level: opt_in
        brief: Framework that produced the source evidence.
      - id: earshot.framework.version
        type: string
        requirement_level: opt_in
        brief: Exact framework version observed by the adapter.
      - id: earshot.framework.operation.name
        type: string
        requirement_level: opt_in
        brief: Privacy-governed native framework operation label retained alongside Earshot classification.
      - id: earshot.framework.metric.name
        type: string
        requirement_level: opt_in
        brief: Governed source-framework label identifying a metric producer or component.
      - id: earshot.request.id
        type: string
        requirement_level: opt_in
        brief: Opaque provider request identifier used only for evidence correlation.
      - id: earshot.language.code
        type: string
        requirement_level: opt_in
        brief: BCP 47 language tag reported or configured for a speech-recognition operation.
      - id: earshot.language.probability
        type: double
        requirement_level: opt_in
        brief: Provider-reported probability, from zero through one, for the detected language.
      - id: earshot.stt.mode
        type: string
        requirement_level: opt_in
        brief: Governed speech-recognition mode such as transcribe, translate, verbatim, translit, or codemix.
      - id: earshot.stt.usage.audio_seconds
        type: double
        requirement_level: opt_in
        stability: development
        brief: Provider-metered STT input audio quantity in seconds for one request.
        note: The semantic type is double; a positive OTLP intValue is also permitted by the host profile as numeric input. Omit when unknown. A present value is positive and finite. This value is per request; hosts omit streaming-session totals reported at close. Do not infer it from span duration or the caller's speech window.
      - id: earshot.tts.usage.character_count
        type: int
        requirement_level: opt_in
        stability: development
        brief: Provider-metered TTS input character quantity for one request, in the provider's own metering units.
        note: Omit when unknown. A present value is a positive integer. Do not infer it by counting text, bytes, Unicode scalar values, or grapheme clusters.
      - id: earshot.conversation.item.id
        type: string
        requirement_level: opt_in
        brief: Opaque conversation-item identifier; it is not a turn identifier.
      - id: earshot.conversation.role
        type: string
        requirement_level: opt_in
        brief: Privacy-governed role attached to a conversation item.
      - id: earshot.tts.voice
        type: string
        requirement_level: opt_in
        brief: Privacy-governed provider voice identifier selected for speech synthesis.
      - id: earshot.integration.tvic.epoch
