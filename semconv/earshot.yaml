# Earshot semantic profile v0.2 authoring source.
# Keep vocabulary open for forward compatibility and reuse existing GenAI/OpenInference fields where applicable.
# Call grouping prefers `earshot.session.id`, `gen_ai.conversation.id`, `session.id`, then `conversation.id`.
# Adapters should pin the semantic-conventions revision they implement.
earshot_semantic_profile_version: 0.2.0
groups:
  - id: registry.earshot
    type: attribute_group
    brief: Common attributes for portable real-time voice-session evidence.
    attributes:
      - id: session.id
        type: string
        requirement_level: opt_in
        brief: A unique session identifier, reused from the pinned OpenTelemetry semantic-conventions registry.
      - id: earshot.session.id
        type: string
        requirement_level: recommended
        brief: The host's session key for the call a span belongs to, 1 to 256 UTF-8 bytes after trimming; the first key Earshot's receiver consults, on a span or on its resource.
      - id: earshot.call.ended
        type: boolean
        requirement_level: opt_in
        brief: Set to true on any span to signal that its call has ended, so the call closes after a short grace period.
      - id: earshot.agent.name
        type: string
        requirement_level: opt_in
        brief: The agent that handled the call, as the call list filters on it; preferred over gen_ai.agent.name, lk.agent_name and the resource service.name (an unknown_service default never names the agent). 1 to 256 characters; the first span carrying it wins.
      - id: earshot.call.outcome
        type: string
        requirement_level: opt_in
        brief: The call's outcome as the host defines it (for example transferred or voicemail), 1 to 256 characters; the last value sent wins. Without it Earshot derives error (a span with error status), interrupted (no end signal) or completed.
      - id: earshot.call.tags
        type: string[]
        requirement_level: opt_in
        brief: Labels for the call (each 1 to 256 characters); a call's tags are the union of every span's, and the call list filters on them (all given must match).
      - id: earshot.turn.id
        type: string
        requirement_level: opt_in
        brief: Opaque turn projection identifier; turns are not graph containers.
      - id: earshot.turn.index
        type: int
        requirement_level: opt_in
        brief: Producer-observed presentation order for a turn projection.
      - id: earshot.turn.reported_latency_ms
        type: double
        requirement_level: opt_in
        brief: "Host span profile: the host's own measure of a turn's latency, in milliseconds, on its turn span; absent when the host has none, never 0. A value that is not a finite, non-negative number is unknown."
      - id: earshot.turn.timeline_continuous
        type: boolean
        requirement_level: opt_in
        brief: "Host span profile: false when the host's recording timeline was not continuous across the turn (frames dropped or placed late), so its audible gap is not measurable; true or absent, the timeline is taken as continuous."
      - id: earshot.operation.name
        type: string
        requirement_level: required
        brief: Open voice operation name such as vad, turn_detection, stt, llm, tts, transport_send, or render.
      - id: earshot.operation.id
        type: string
        requirement_level: opt_in
        brief: Opaque incident operation referenced by a derived or provider quality sample.
      - id: earshot.participant.id
        type: string
        requirement_level: opt_in
        brief: Opaque participant reference from the incident profile.
      - id: earshot.stream.id
        type: string
        requirement_level: opt_in
        brief: Opaque audio-stream reference from the incident profile.
      - id: earshot.framework.name
        type: string
        requirement_level: opt_in
        brief: Framework that produced the source evidence.
      - id: earshot.framework.version
        type: string
        requirement_level: opt_in
        brief: Exact framework version observed by the adapter.
      - id: earshot.framework.operation.name
        type: string
        requirement_level: opt_in
        brief: Privacy-governed native framework operation label retained alongside Earshot classification.
      - id: earshot.framework.metric.name
        type: string
        requirement_level: opt_in
        brief: Governed source-framework label identifying a metric producer or component.
      - id: earshot.request.id
        type: string
        requirement_level: opt_in
        brief: Opaque provider request identifier used only for evidence correlation.
      - id: earshot.language.code
        type: string
        requirement_level: opt_in
        brief: BCP 47 language tag reported or configured for a speech-recognition operation.
      - id: earshot.language.probability
        type: double
        requirement_level: opt_in
        brief: Provider-reported probability, from zero through one, for the detected language.
      - id: earshot.stt.mode
        type: string
        requirement_level: opt_in
        brief: Governed speech-recognition mode such as transcribe, translate, verbatim, translit, or codemix.
      - id: earshot.conversation.item.id
        type: string
        requirement_level: opt_in
        brief: Opaque conversation-item identifier; it is not a turn identifier.
      - id: earshot.conversation.role
        type: string
        requirement_level: opt_in
        brief: Privacy-governed role attached to a conversation item.
      - id: earshot.tts.voice
        type: string
        requirement_level: opt_in
        brief: Privacy-governed provider voice identifier selected for speech synthesis.
      - id: earshot.source.field
        type: string
        requirement_level: opt_in
        brief: Original framework, provider, protocol, or SDK field mapped to this fact.
      - id: earshot.source.event.name
        type: string
        requirement_level: opt_in
        brief: Allowlisted native span-event name or its sha256-prefixed digest label.
      - id: earshot.source.name_sha256
        type: string
        requirement_level: opt_in
        brief: Lowercase hexadecimal SHA-256 of an unsafe source operation or event label.
      - id: earshot.source.status_sha256
        type: string
        requirement_level: opt_in
        brief: Lowercase hexadecimal SHA-256 of an unsafe source status label.
      - id: earshot.source.schema_url_sha256
        type: string
        requirement_level: opt_in
        brief: Lowercase hexadecimal SHA-256 of a dropped unsafe or noncanonical source schema URL.
      - id: earshot.source.resource_schema_url_sha256
        type: string
        requirement_level: opt_in
        brief: Lowercase hexadecimal SHA-256 of a dropped unsafe or noncanonical resource schema URL.
      - id: earshot.analysis.synthetic_projection
        type: boolean
        requirement_level: opt_in
        brief: Marks a private analysis-only point projected from an operation boundary.
      - id: earshot.clock.domain.id
        type: string
        requirement_level: opt_in
        brief: Clock domain in which a monotonic value is comparable.
      - id: earshot.time.monotonic_nano
        type: string
        requirement_level: opt_in
        brief: Exact non-negative decimal-string monotonic nanoseconds within the named clock domain.
      - id: earshot.time.observed_unix_nano
        type: string
        requirement_level: opt_in
        brief: Exact decimal-string collector observation time in Unix nanoseconds.
      - id: earshot.time.uncertainty_nano
        type: string
        requirement_level: opt_in
        brief: Exact decimal-string uncertainty bound for an aligned timestamp.
      - id: earshot.event.id
        type: string
        requirement_level: opt_in
        brief: Globally unique event identifier within an incident bundle.
      - id: earshot.event.name
        type: string
        requirement_level: opt_in
        brief: Open point-event name, normally prefixed with earshot.
      - id: earshot.link.type
        type: string
        requirement_level: opt_in
        brief: Open causal relationship such as produced_by, consumes, retries, supersedes, interrupts, handoff, or duplicates.
      - id: earshot.link.target_scope
        type: string
        requirement_level: opt_in
        brief: Whether a target is internal, external, or unknown to this artifact.
      - id: earshot.evidence.source
        type: string
        requirement_level: opt_in
        brief: App, provider, webrtc_stats, rtcp, carrier, audio inference, user feedback, or another open evidence source.
      - id: earshot.evidence.observer
        type: string
        requirement_level: opt_in
        brief: Component that observed the evidence, such as client, server, or gateway.
      - id: earshot.evidence.method
        type: string
        requirement_level: opt_in
        brief: Measurement, estimate, inference, or provider method name.
      - id: earshot.evidence.method_version
        type: string
        requirement_level: opt_in
        brief: Version of the evidence method when known.
      - id: earshot.evidence.confidence
        type: string
        requirement_level: opt_in
        brief: Open confidence classification; measured, estimated, and inferred are the standard values.
      - id: earshot.evidence.availability
        type: string
        requirement_level: opt_in
        brief: Open availability classification; unavailable evidence is never encoded as zero.
      - id: earshot.privacy.capture_class
        type: string
        requirement_level: opt_in
        brief: Privacy class governing this record or payload.
      - id: earshot.quality.aggregation
        type: string
        requirement_level: opt_in
        brief: Instant, delta, cumulative, or another explicitly named aggregation.
      - id: earshot.correlation
        type: string
        requirement_level: opt_in
        brief: Correlation strength or scope, such as provider-turn scalar, ordered-index inference, or session-only.
      - id: earshot.chronology
        type: string
        requirement_level: opt_in
        brief: Whether the provider exposes timing boundaries that can author chronology.
      - id: earshot.unit_basis
        type: string
        requirement_level: opt_in
        brief: Provider-unit provenance when an official schema does not define a normalizable unit.
      - id: earshot.metric.basis
        type: string
        requirement_level: opt_in
        brief: Exact source-boundary basis of a directly observed or provider-native measurement.
      - id: earshot.duration.audio_seconds
        type: double
        requirement_level: opt_in
        brief: Provider-reported audio duration in seconds.
      - id: earshot.duration.inference_seconds
        type: double
        requirement_level: opt_in
        brief: Provider-reported inference duration in seconds.
      - id: earshot.duration.vad.idle_seconds
        type: double
        requirement_level: opt_in
        brief: Time since the VAD stream last observed a speech-boundary activity, in seconds.
      - id: earshot.duration.turn_callback_seconds
        type: double
        requirement_level: opt_in
        brief: Delay to invoke the application user-turn-completed callback, in seconds.
      - id: earshot.duration.turn_detection.detection_delay_seconds
        type: double
        requirement_level: opt_in
        brief: Delay from the latest input audio to an end-of-turn inference response, in seconds.
      - id: earshot.duration.turn_detection.prediction_seconds
        type: double
        requirement_level: opt_in
        brief: End-of-turn model prediction duration, in seconds.
      - id: earshot.duration.turn_detection.total_seconds
        type: double
        requirement_level: opt_in
        brief: Total end-of-turn inference duration from earliest input audio, in seconds.
      - id: earshot.duration.avatar.playback_latency_seconds
        type: double
        requirement_level: opt_in
        brief: Avatar playback-start latency in seconds.
      - id: earshot.duration.interruption.detection_delay_seconds
        type: double
        requirement_level: opt_in
        brief: Interruption detector delay in seconds.
      - id: earshot.duration.interruption.prediction_seconds
        type: double
        requirement_level: opt_in
        brief: Interruption-model prediction duration in seconds.
      - id: earshot.duration.interruption.total_seconds
        type: double
        requirement_level: opt_in
        brief: Total interruption-detection duration in seconds.
      - id: earshot.metric.connection.reused
        type: boolean
        requirement_level: opt_in
        brief: Whether a provider connection was reused.
      - id: earshot.metric.inference.count
        type: int
        requirement_level: opt_in
        brief: Count of provider inference operations.
      - id: earshot.metric.interruption.accepted
        type: boolean
        requirement_level: opt_in
        brief: Whether an interruption decision was accepted.
      - id: earshot.metric.interruption.backchannel_count
        type: int
        requirement_level: opt_in
        brief: Count of interruption-detector backchannels.
      - id: earshot.metric.interruption.count
        type: int
        requirement_level: opt_in
        brief: Count of interruption decisions reported by a provider.
      - id: earshot.metric.interruption.probability
        type: double
        requirement_level: opt_in
        brief: Provider-reported interruption probability.
      - id: earshot.metric.interruption.request_count
        type: int
        requirement_level: opt_in
        brief: Count of interruption-detector requests.
      - id: earshot.metric.interruption.resumed
        type: boolean
        requirement_level: opt_in
        brief: Whether output resumed after a false interruption.
      - id: earshot.metric.model.total_tokens
        type: int
        requirement_level: opt_in
        brief: Provider-reported total model tokens.
      - id: earshot.metric.request.cancelled
        type: boolean
        requirement_level: opt_in
        brief: Whether a provider request was cancelled.
      - id: earshot.metric.request.streamed
        type: boolean
        requirement_level: opt_in
        brief: Whether a provider request used streaming.
      - id: earshot.metric.turn_detection.request_count
        type: int
        requirement_level: opt_in
        brief: Count of provider requests made for one end-of-turn inference.
      - id: earshot.connector.provider
        type: string
        requirement_level: opt_in
        brief: The hosted voice provider a connector's evidence came from (vapi, retell, elevenlabs, ringg), on the evidence resource.
      - id: earshot.connector.call.type
        type: string
        requirement_level: opt_in
        brief: The provider's call type as it names it (for example webCall, phone_call, inbound).
      - id: earshot.connector.call.status
        type: string
        requirement_level: opt_in
        brief: The provider's final call status as it names it.
      - id: earshot.connector.call.ended_reason
        type: string
        requirement_level: opt_in
        brief: Why the provider says the call ended, as its own enumeration names it.
      - id: earshot.connector.coverage.turn_latency
        type: string
        requirement_level: opt_in
        brief: available when the provider exposed per-turn latency for the call, not_exposed when it did not; the call keeps its transcript and audio either way.
      - id: earshot.connector.transcript.speaker
        type: string
        requirement_level: opt_in
        brief: "user or agent: who spoke a provider transcript line. Transcript content: not kept under metadata_only."
      - id: earshot.connector.transcript.text
        type: string
        requirement_level: opt_in
        brief: "The text of a provider transcript line. Transcript content: not kept under metadata_only."
      - id: earshot.connector.transcript.timing
        type: string
        requirement_level: opt_in
        brief: "measured (the span's start and end are the line's), start_only (only the start is; the end equals it and is not a measurement) or order_only (neither time is a measurement: order lines by transcript.index)."
      - id: earshot.connector.transcript.index
        type: int
        requirement_level: opt_in
        brief: The line's position in the provider's transcript, from 0.
      - id: earshot.connector.transcript.interrupted
        type: boolean
        requirement_level: opt_in
        brief: Whether the provider marked the line as cut off by an interruption.
      - id: earshot.connector.turn.index
        type: int
        requirement_level: opt_in
        brief: The provider's position of a turn whose latency it reported, from 0.
      - id: earshot.connector.latency.turn_ms
        type: double
        requirement_level: opt_in
        brief: The whole turn's latency the provider reported for it, in milliseconds.
      - id: earshot.connector.latency.llm_ms
        type: double
        requirement_level: opt_in
        brief: "A turn's LLM stage latency as the provider reported it, in milliseconds (a provider stage split: detail only)."
      - id: earshot.connector.latency.tts_ms
        type: double
        requirement_level: opt_in
        brief: A turn's speech-synthesis stage latency as the provider reported it, in milliseconds (detail only).
      - id: earshot.connector.latency.stt_ms
        type: double
        requirement_level: opt_in
        brief: A turn's transcription stage latency as the provider reported it, in milliseconds (detail only).
      - id: earshot.connector.latency.endpointing_ms
        type: double
        requirement_level: opt_in
        brief: A turn's endpointing latency as the provider reported it, in milliseconds (detail only).
      - id: earshot.connector.latency.component
        type: string
        requirement_level: opt_in
        brief: Which provider latency series a latency span holds, as the provider names it (for example e2e, llm, tts).
      - id: earshot.connector.latency.values_ms
        type: double[]
        requirement_level: opt_in
        brief: A provider latency series not tied to turns, in milliseconds, in the provider's order.
      - id: earshot.connector.analysis.summary_message
        type: string
        requirement_level: opt_in
        brief: "The provider's model-generated summary of the call. Model output: not kept under metadata_only."
      - id: earshot.connector.analysis.successful
        type: string
        requirement_level: opt_in
        brief: The provider's verdict on whether the call succeeded, as it states it (for example true, success).
      - id: earshot.connector.analysis.sentiment
        type: string
        requirement_level: opt_in
        brief: The provider's user-sentiment label for the call.
      - id: earshot.connector.analysis.in_voicemail
        type: boolean
        requirement_level: opt_in
        brief: Whether the provider says the call reached voicemail.
      - id: earshot.connector.analysis.classification
        type: string
        requirement_level: opt_in
        brief: The provider's classification label for the call.
      - id: earshot.connector.cost.amount
        type: double
        requirement_level: opt_in
        brief: What the provider reports the call cost, in cost.unit. Never added to Earshot's own estimate.
      - id: earshot.connector.cost.unit
        type: string
        requirement_level: opt_in
        brief: "usd, usd_cent or credit: the unit of cost.amount."
      - id: earshot.connector.cost.source
        type: string
        requirement_level: opt_in
        brief: The payload field cost.amount was read from.
      - id: earshot.connector.translator.version
        type: string
        requirement_level: opt_in
        brief: The version of the translator that wrote a delivery's evidence spans.
      - id: earshot.upload.format
        type: string
        requirement_level: opt_in
        brief: "vtt or text: the format of a transcript uploaded for a recording (POST /v1/recordings/{id}/transcript)."
      - id: earshot.upload.line_count
        type: int
        requirement_level: opt_in
        brief: How many transcript lines an uploaded transcript holds.
      - id: earshot.upload.sha256
        type: string
        requirement_level: opt_in
        brief: The sha256 (hex) of an uploaded transcript's format and lines, as Earshot parsed them; a different transcript for the same recording is refused (409), never stored.

  - id: span.earshot.voice_operation
    type: span
    span_kind: internal
    brief: A source operation classified with the Earshot voice profile.
    attributes:
      - ref: session.id
        requirement_level: required
      - ref: earshot.operation.name
        requirement_level: required
      - ref: earshot.turn.id
      - ref: earshot.participant.id
      - ref: earshot.stream.id
      - ref: earshot.framework.name
      - ref: earshot.framework.version
      - ref: earshot.source.field
      - ref: earshot.clock.domain.id
      - ref: earshot.time.monotonic_nano
      - ref: earshot.time.observed_unix_nano
      - ref: earshot.time.uncertainty_nano
      - ref: earshot.evidence.source
      - ref: earshot.evidence.observer
      - ref: earshot.evidence.method
      - ref: earshot.evidence.method_version
      - ref: earshot.evidence.confidence
      - ref: earshot.evidence.availability
      - ref: earshot.privacy.capture_class

  - id: event.earshot.voice_event
    type: event
    brief: An independently timestamped voice-session point event carried as an OTLP log record when authored by Earshot.
    attributes:
      - ref: session.id
        requirement_level: required
      - ref: earshot.event.id
        requirement_level: required
      - ref: earshot.event.name
        requirement_level: required
      - ref: earshot.turn.id
      - ref: earshot.participant.id
      - ref: earshot.stream.id
      - ref: earshot.clock.domain.id
      - ref: earshot.time.monotonic_nano
      - ref: earshot.time.observed_unix_nano
      - ref: earshot.time.uncertainty_nano
      - ref: earshot.evidence.source
      - ref: earshot.evidence.observer
      - ref: earshot.evidence.method
      - ref: earshot.evidence.method_version
      - ref: earshot.evidence.confidence
      - ref: earshot.evidence.availability
      - ref: earshot.privacy.capture_class

  - id: span.earshot.connector.call
    type: span
    span_kind: internal
    brief: "A hosted provider's call, translated from its delivery: the call's window and status, and its end (earshot.call.ended). Every other connector span is its child, on one trace per session key. Agent identifiers use the OpenTelemetry GenAI keys gen_ai.agent.id and gen_ai.agent.name."
    attributes:
      - ref: earshot.session.id
      - ref: earshot.call.ended
      - ref: earshot.connector.call.type
      - ref: earshot.connector.call.status
      - ref: earshot.connector.call.ended_reason
      - ref: earshot.connector.coverage.turn_latency

  - id: span.earshot.connector.transcript_line
    type: span
    span_kind: internal
    brief: One line of a provider's transcript; span ID from the line index, so every delivery of the call writes it identically.
    attributes:
      - ref: earshot.session.id
      - ref: earshot.connector.transcript.speaker
      - ref: earshot.connector.transcript.text
      - ref: earshot.connector.transcript.timing
      - ref: earshot.connector.transcript.index
      - ref: earshot.connector.transcript.interrupted

  - id: span.earshot.connector.turn
    type: span
    span_kind: internal
    brief: One turn's latency as the provider reported it.
    attributes:
      - ref: earshot.session.id
      - ref: earshot.connector.turn.index
      - ref: earshot.connector.latency.turn_ms
      - ref: earshot.connector.latency.llm_ms
      - ref: earshot.connector.latency.tts_ms
      - ref: earshot.connector.latency.stt_ms
      - ref: earshot.connector.latency.endpointing_ms

  - id: span.earshot.connector.latency
    type: span
    span_kind: internal
    brief: A provider latency series not tied to turns.
    attributes:
      - ref: earshot.session.id
      - ref: earshot.connector.latency.component
      - ref: earshot.connector.latency.values_ms

  - id: span.earshot.connector.analysis
    type: span
    span_kind: internal
    brief: The provider's analysis of the call; a kind of its own, so an analysis that arrives in a later delivery is new evidence, never a conflict.
    attributes:
      - ref: earshot.session.id
      - ref: earshot.connector.analysis.summary_message
      - ref: earshot.connector.analysis.successful
      - ref: earshot.connector.analysis.sentiment
      - ref: earshot.connector.analysis.in_voicemail
      - ref: earshot.connector.analysis.classification

  - id: span.earshot.connector.cost
    type: span
    span_kind: internal
    brief: What the provider reports the call cost.
    attributes:
      - ref: earshot.session.id
      - ref: earshot.connector.cost.amount
      - ref: earshot.connector.cost.unit
      - ref: earshot.connector.cost.source

  - id: span.earshot.connector.translator
    type: span
    span_kind: internal
    brief: The translator that wrote a delivery's spans, keyed by its version, so an upgraded translator never changes a span another delivery wrote.
    attributes:
      - ref: earshot.session.id
      - ref: earshot.connector.translator.version

  - id: span.earshot.upload.transcript
    type: span
    span_kind: internal
    brief: "A transcript uploaded for a recording, under the earshot.upload instrumentation scope, on one trace per recording. Its children are span.earshot.connector.transcript_line spans with the same attributes as a provider's lines: timing measured for WebVTT (cue times from the recording's started_at), order_only for plain text. The trace is bound to the recording's call."
    attributes:
      - ref: earshot.upload.format
      - ref: earshot.upload.line_count
      - ref: earshot.upload.sha256

  - id: span.earshot.host.turn
    type: span
    span_kind: internal
    brief: "Host span profile: one turn of a call a host runs on its own pipeline, under the earshot.host instrumentation scope, times on the clock of the host's recordings. Its children are its speech and stage spans. It carries no transcript text."
    attributes:
      - ref: earshot.turn.id
        requirement_level: required
      - ref: earshot.turn.index
      - ref: earshot.turn.reported_latency_ms
      - ref: earshot.turn.timeline_continuous

  - id: span.earshot.host.speech
    type: span
    span_kind: internal
    brief: "Host span profile: a user_speech or agent_speech span, a child of its turn, by the window of one stretch of the caller's or the agent's speech. User on is the starts of a turn's user_speech spans, user off the latest of their ends, agent on the earliest start of its agent_speech spans."
    attributes:
      - ref: earshot.turn.id

  - id: span.earshot.host.stage
    type: span
    span_kind: internal
    brief: "Host span profile: an stt, llm or tts span, a child of its turn, by the window of one stage request. It names the provider and model with gen_ai.provider.name and gen_ai.request.model; an llm span reports its gen_ai.usage.* counts. A stage the host did not time has no span."
    attributes:
      - ref: earshot.turn.id
